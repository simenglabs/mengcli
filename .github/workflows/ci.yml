name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # git is preinstalled; tmux is not, and the CLI refuses to start without it.
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y tmux
          else
            brew install tmux
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # git identity is required by the worktree/commit tests.
      - name: Configure git
        run: |
          git config --global user.email "ci@menglabs.dev"
          git config --global user.name "CI"

      - name: Verify the package installs and runs
        run: |
          npm pack
          TARBALL=$(ls menglabs-mengcli-*.tgz)
          mkdir -p /tmp/installcheck && cd /tmp/installcheck
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$TARBALL"
          ./node_modules/.bin/mengcli --version
          ./node_modules/.bin/mengcli help >/dev/null
          # doctor exits 0 even without config; it only reports.
          ./node_modules/.bin/mengcli doctor
